<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ חידון הטיול הגדול!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a0a00 0%, #2d1810 30%, #1a0a00 70%, #2d1810 100%);
            color: #f5e6d3;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ===== TEMPLE DECORATIONS ===== */
        .temple-border {
            border: 3px solid #d4af37;
            border-radius: 20px;
            padding: 30px 25px;
            background: linear-gradient(145deg, rgba(42,26,14,0.95), rgba(61,40,23,0.95));
            box-shadow: 0 0 40px rgba(212,175,55,0.15), inset 0 0 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .temple-border::before, .temple-border::after {
            content: '🏛️';
            position: absolute;
            font-size: 24px;
            top: -15px;
        }
        .temple-border::before { right: 20px; }
        .temple-border::after { left: 20px; }

        .gold-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 15px 0;
        }

        /* ===== WELCOME SCREEN ===== */
        #welcome-screen { text-align: center; }

        .main-title {
            font-size: 2.2em;
            font-weight: 800;
            background: linear-gradient(180deg, #ffd700, #d4af37, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 1.1em;
            color: #c4a882;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .welcome-emoji {
            font-size: 4em;
            margin: 15px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .name-input {
            width: 100%;
            max-width: 350px;
            padding: 15px 20px;
            border: 2px solid #8b6914;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            color: #ffd700;
            font-size: 1.2em;
            text-align: center;
            font-family: 'Heebo', sans-serif;
            outline: none;
            transition: all 0.3s;
            margin: 10px 0;
        }

        .name-input::placeholder { color: #8b7355; }
        .name-input:focus { border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.2); }

        .start-btn {
            display: inline-block;
            padding: 15px 50px;
            margin-top: 20px;
            background: linear-gradient(145deg, #d4af37, #b8860b);
            color: #1a0a00;
            border: none;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Heebo', sans-serif;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }

        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212,175,55,0.4); }
        .start-btn:active { transform: translateY(0); }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #c4a882;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #ffd700);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* ===== QUESTION AREA ===== */
        .question-number {
            font-size: 0.95em;
            color: #d4af37;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .question-text {
            font-size: 1.35em;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #fff;
        }

        .question-image-container {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .question-image-container img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            border: 2px solid #8b6914;
            object-fit: cover;
        }

        .question-image-container .emoji-image {
            font-size: 5em;
            display: block;
            margin: 10px auto;
        }

        /* ===== VIDEO AREA (Q9) ===== */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .video-card {
            background: rgba(0,0,0,0.4);
            border: 2px solid #5a4020;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .video-card:hover { border-color: #d4af37; transform: scale(1.02); }

        .video-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-thumb .play-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            opacity: 0.9;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            pointer-events: none;
        }

        .video-card-title {
            padding: 8px;
            text-align: center;
            font-size: 0.9em;
            font-weight: 600;
            color: #d4af37;
        }

        .video-watch-label {
            display: block;
            text-align: center;
            color: #c4a882;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* ===== ANSWER BUTTONS ===== */
        .answers-container { margin-bottom: 15px; }

        .answer-btn {
            width: 100%;
            padding: 14px 20px;
            margin: 7px 0;
            background: linear-gradient(145deg, #3d2817, #4a3020);
            border: 2px solid #6b5020;
            border-radius: 12px;
            color: #f5e6d3;
            font-size: 1.05em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: right;
            font-family: 'Heebo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-btn .answer-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(212,175,55,0.2);
            color: #d4af37;
            font-weight: 700;
            font-size: 0.9em;
            flex-shrink: 0;
        }

        .answer-btn:hover:not(.disabled) {
            transform: translateX(-5px);
            border-color: #d4af37;
            background: linear-gradient(145deg, #4a3020, #5a3d2a);
        }

        .answer-btn.correct {
            background: linear-gradient(145deg, #1b5e20, #2e7d32) !important;
            border-color: #4CAF50 !important;
            animation: pulseCorrect 0.6s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(145deg, #7f1d1d, #991b1b) !important;
            border-color: #ef4444 !important;
            animation: shakeWrong 0.5s ease;
        }

        .answer-btn.disabled { cursor: default; opacity: 0.6; pointer-events: none; }

        @keyframes pulseCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @keyframes shakeWrong {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* ===== FEEDBACK MESSAGES ===== */
        .feedback-box {
            padding: 15px 20px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 1.05em;
            line-height: 1.5;
            animation: fadeSlideIn 0.4s ease;
            display: none;
        }

        .feedback-box.show { display: block; }

        .feedback-correct {
            background: rgba(76,175,80,0.15);
            border: 2px solid #4CAF50;
            color: #a5d6a7;
        }

        .feedback-wrong {
            background: rgba(244,67,54,0.1);
            border: 2px solid #8b4513;
            color: #e0c4a8;
        }

        .hint-box {
            background: rgba(255,193,7,0.1);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 15px 20px;
            margin: 10px 0;
            color: #ffd700;
            font-size: 1em;
            animation: fadeSlideIn 0.4s ease;
            display: none;
        }

        .hint-box.show { display: block; }

        .hint-box::before { content: '💡 רמז: '; font-weight: 700; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== NEXT BUTTON ===== */
        .next-btn {
            display: none;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(145deg, #d4af37, #b8860b);
            color: #1a0a00;
            border: none;
            border-radius: 12px;
            font-size: 1.15em;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Heebo', sans-serif;
            transition: all 0.3s;
            animation: fadeSlideIn 0.4s ease;
        }

        .next-btn.show { display: block; }
        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(212,175,55,0.3); }

        /* ===== RESULTS SCREEN ===== */
        #results-screen { display: none; text-align: center; }

        .results-title {
            font-size: 2em;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .results-name {
            font-size: 1.5em;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .results-stars {
            font-size: 3em;
            margin: 15px 0;
            animation: float 2s ease-in-out infinite;
        }

        .results-score {
            font-size: 1.8em;
            font-weight: 700;
            color: #fff;
            margin: 10px 0;
        }

        .results-details {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: right;
        }

        .results-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 5px;
            border-bottom: 1px solid rgba(212,175,55,0.15);
            font-size: 0.95em;
        }

        .results-row:last-child { border-bottom: none; }

        .results-row .q-label { color: #c4a882; flex: 1; }
        .results-row .q-attempts { color: #d4af37; font-weight: 600; min-width: 80px; text-align: left; }

        .results-message {
            font-size: 1.2em;
            color: #c4a882;
            margin: 15px 0;
            line-height: 1.6;
        }

        .restart-btn {
            display: inline-block;
            padding: 14px 40px;
            margin-top: 20px;
            background: linear-gradient(145deg, #d4af37, #b8860b);
            color: #1a0a00;
            border: none;
            border-radius: 12px;
            font-size: 1.15em;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Heebo', sans-serif;
            transition: all 0.3s;
        }

        .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212,175,55,0.4); }

        /* ===== CONFETTI ===== */
        .confetti-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 12px;
            height: 12px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container { padding: 10px; }
            .temple-border { padding: 20px 15px; }
            .main-title { font-size: 1.7em; }
            .question-text { font-size: 1.15em; }
            .answer-btn { font-size: 0.95em; padding: 12px 15px; }
            .video-grid { grid-template-columns: 1fr; }
        }

        /* ===== SCREEN TRANSITIONS ===== */
        .screen-enter { animation: fadeSlideIn 0.5s ease; }
    </style>
</head>
<body>

<!-- CONFETTI CONTAINER -->
<div class="confetti-container" id="confettiContainer"></div>

<div class="container">

    <!-- ===== WELCOME SCREEN ===== -->
    <div id="welcome-screen" class="temple-border">
        <div style="text-align:center;">
            <div class="welcome-emoji">🏛️</div>
            <h1 class="main-title">חידון הטיול הגדול!</h1>
            <p class="subtitle">כמה אתם זוכרים מהטיול המשפחתי?</p>
            <div class="gold-line"></div>
            <p style="color:#c4a882; margin-bottom:20px; font-size:1em;">13 שאלות, רמזים, והרבה כיף!</p>
            <input type="text" class="name-input" id="playerName" placeholder="✏️ מה השם שלך?" maxlength="20" autofocus>
            <br>
            <button class="start-btn" id="startBtn" onclick="startQuiz()">!יאללה מתחילים 🚀</button>
        </div>
    </div>

    <!-- ===== QUIZ SCREEN ===== -->
    <div id="quiz-screen" class="temple-border" style="display:none;">
        <div class="progress-container">
            <div class="progress-text">
                <span id="progressLabel">שאלה 1 מתוך 13</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
        </div>

        <div id="questionArea">
            <div class="question-number" id="questionNumber"></div>
            <div class="question-text" id="questionText"></div>
            <div class="question-image-container" id="questionImage"></div>
            <div class="answers-container" id="answersContainer"></div>
        </div>

        <div class="hint-box" id="hintBox"></div>
        <div class="feedback-box" id="feedbackBox"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">לשאלה הבאה ⬅️</button>
    </div>

    <!-- ===== RESULTS SCREEN ===== -->
    <div id="results-screen" class="temple-border" style="display:none;"></div>

</div>

        answers: ['כחול-אפור 🔵', 'לבן בוהק ⚪', 'חום-אדמדם 🟤', 'ירוק כהה 🟢'],
        correct: 0,
        hint: 'היום הן אפורות ושחורות, אבל פעם הצבע היה דומה לשמיים ביום מעונן ☁️',
        emoji: '🪨',
        imageUrl: 'quiz_images/angkor_reflection.jpg'
    },
    {
        question: 'כמה עמודים יש בכל פתח במקדש?',
        answers: ['7', '4', '10', '6'],
        correct: 0,
        hint: 'במקדשים הכל במספרים אי-זוגיים... וזה מספר אי-זוגי בין 5 ל-9 🔢',
        emoji: '🏛️',
        imageUrl: 'quiz_images/taprohm_pillars.jpg'
    },
    {
        question: 'איך קוראים למקדש המפורסם עם הפנים הענקיות המחייכות?',
        answers: ['באיון (Bayon) 😊', 'אנגקור וואט', 'טא פרום', 'בנטאי סריי'],
        correct: 0,
        hint: 'המקדש הזה מלא בפנים ענקיות מכל כיוון שמסתכלים... והם תמיד מחייכים! 😊',
        emoji: null,
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Bayonfacetower01.JPG/480px-Bayonfacetower01.JPG'
    }
];

// ===== ENCOURAGEMENT MESSAGES =====
const wrongMessages = [
    'אופס! לא נורא, נסו שוב! 💪',
    'כמעט! אתם בכיוון הנכון! 🎯',
    'לא מדויק, אבל אתם גיבורים שממשיכים! 🦸',
    'טעות זה בסדר! ככה לומדים! 📚',
    'לא הפעם... אבל אתם יכולים! 🌟',
    'נסיון יפה! תנסו שוב! ✨',
    'עוד קצת... אתם כמעט שם! 🏃',
    'וואו, שאלה קשה! תנסו שוב! 🧠'
];

const correctMessages = [
    'מדהים! תשובה נכונה! 🎉',
    'וואו, איזה זיכרון! 🧠✨',
    'בול! אתם אלופים! 🏆',
    'נכוווון! כל הכבוד! 🌟',
    'מעולה! אתם זוכרים הכל! 💯',
    'יש! תשובה מושלמת! 🎊',
    'אלופי העולם! 👑',
    'בדיוק! איזה חכמים! 🦉'
];

// ===== STATE =====
let currentQuestion = 0;
let playerName = '';
let attempts = [];
let currentAttempts = 0;
let hintShown = false;
let answered = false;
let shuffledIndices = [];

// ===== FUNCTIONS =====

function shuffleAnswers(q) {
    const indices = q.answers.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
}

function startQuiz() {
    playerName = document.getElementById('playerName').value.trim();
    if (!playerName) {
        document.getElementById('playerName').style.borderColor = '#ef4444';
        document.getElementById('playerName').setAttribute('placeholder', '⚠️ צריך לכתוב שם!');
        return;
    }
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('quiz-screen').classList.add('screen-enter');
    currentQuestion = 0;
    attempts = [];
    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestion];
    currentAttempts = 0;
    hintShown = false;
    answered = false;

    // Shuffle answer order
    shuffledIndices = shuffleAnswers(q);

    // Progress
    const pct = Math.round((currentQuestion / questions.length) * 100);
    document.getElementById('progressLabel').textContent = `שאלה ${currentQuestion + 1} מתוך ${questions.length}`;
    document.getElementById('progressPercent').textContent = `${pct}%`;
    document.getElementById('progressFill').style.width = `${pct}%`;

    // Question text
    document.getElementById('questionNumber').textContent = `שאלה ${currentQuestion + 1}`;
    document.getElementById('questionText').textContent = q.question;

    // Image area
    const imgContainer = document.getElementById('questionImage');
    imgContainer.innerHTML = '';

    if (q.isVideoQuestion && q.videos) {
        // Show photo above videos if available
        if (q.imageUrl) {
            const img = document.createElement('img');
            img.src = q.imageUrl;
            img.alt = 'תמונה מהטיול';
            img.style.marginBottom = '15px';
            imgContainer.appendChild(img);
        }
        // Video question - show trailer grid
        const grid = document.createElement('div');
        grid.className = 'video-grid';
        q.videos.forEach(v => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = (e) => { e.preventDefault(); openVideo(v.id); };
            card.innerHTML = `
                <div class="video-thumb">
                    <img src="${v.poster}" alt="${v.title}" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;background:#222;font-size:2em;\\'>🎬</div>'">
                    <div class="play-icon">▶️</div>
                </div>
                <div class="video-card-title">${v.title}</div>
                <span class="video-watch-label">לחצו לצפייה ביוטיוב ▶</span>
            `;
            grid.appendChild(card);
        });
        imgContainer.appendChild(grid);
    } else if (q.imageUrl) {
        const img = document.createElement('img');
        img.src = q.imageUrl;
        img.alt = 'תמונה לשאלה';
        img.onerror = function() {
            this.style.display = 'none';
            if (q.emoji) {
                const em = document.createElement('span');
                em.className = 'emoji-image';
                em.textContent = q.emoji;
                imgContainer.appendChild(em);
            }
        };
        imgContainer.appendChild(img);
    } else if (q.emoji) {
        const em = document.createElement('span');
        em.className = 'emoji-image';
        em.textContent = q.emoji;
        imgContainer.appendChild(em);
    }

    // Answers
    const letters = ['א', 'ב', 'ג', 'ד'];
    const answersContainer = document.getElementById('answersContainer');
    answersContainer.innerHTML = '';
    shuffledIndices.forEach((origIdx, displayIdx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = `<span class="answer-letter">${letters[displayIdx]}</span> ${q.answers[origIdx]}`;
        btn.onclick = () => checkAnswer(origIdx, btn);
        answersContainer.appendChild(btn);
    });

    // Hide hint / feedback / next
    document.getElementById('hintBox').classList.remove('show');
    document.getElementById('hintBox').textContent = '';
    document.getElementById('feedbackBox').classList.remove('show');
    document.getElementById('feedbackBox').className = 'feedback-box';
    document.getElementById('nextBtn').classList.remove('show');

    // Scroll to top
    document.getElementById('quiz-screen').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function checkAnswer(selectedIndex, btnElement) {
    if (answered) return;
    const q = questions[currentQuestion];
    currentAttempts++;

    if (selectedIndex === q.correct) {
        // CORRECT
        answered = true;
        btnElement.classList.add('correct');
        attempts.push(currentAttempts);

        // Disable all buttons
        document.querySelectorAll('.answer-btn').forEach(b => b.classList.add('disabled'));

        // Show feedback
        const fb = document.getElementById('feedbackBox');
        fb.className = 'feedback-box feedback-correct show';
        const msg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
        fb.textContent = currentAttempts === 1 ? `${msg} בניסיון ראשון!` : msg;

        // Mini confetti burst
        createConfetti(15);

        // Show next button
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.textContent = currentQuestion < questions.length - 1 ? 'לשאלה הבאה ⬅️' : 'לתוצאות! 🏆';
        setTimeout(() => nextBtn.classList.add('show'), 500);

    } else {
        // WRONG
        btnElement.classList.add('wrong');
        btnElement.classList.add('disabled');

        // Show encouragement
        const fb = document.getElementById('feedbackBox');
        fb.className = 'feedback-box feedback-wrong show';
        fb.textContent = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];

        // Show hint after first wrong answer
        if (!hintShown) {
            hintShown = true;
            setTimeout(() => {
                const hb = document.getElementById('hintBox');
                hb.textContent = q.hint;
                hb.classList.add('show');
            }, 600);
        }
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function openVideo(videoId) {
    window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
}

function calculateScore() {
    let total = 0;
    attempts.forEach(a => {
        if (a === 1) total += 10;
        else if (a === 2) total += 7;
        else if (a === 3) total += 4;
        else total += 2;
    });
    return total;
}

function getStarRating(score, max) {
    const pct = (score / max) * 100;
    if (pct >= 90) return { stars: '⭐⭐⭐⭐⭐', label: 'גאון המקדשים!' };
    if (pct >= 75) return { stars: '⭐⭐⭐⭐', label: 'מעולה!' };
    if (pct >= 60) return { stars: '⭐⭐⭐', label: 'כל הכבוד!' };
    if (pct >= 40) return { stars: '⭐⭐', label: 'יפה מאוד!' };
    return { stars: '⭐', label: 'השתתפות יפה!' };
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    const resultsScreen = document.getElementById('results-screen');
    resultsScreen.style.display = 'block';
    resultsScreen.classList.add('screen-enter');

    const score = calculateScore();
    const maxScore = questions.length * 10;
    const rating = getStarRating(score, maxScore);

    // Build results detail rows
    let detailsHTML = '';
    questions.forEach((q, i) => {
        const a = attempts[i] || '?';
        const icon = a === 1 ? '🌟' : a === 2 ? '👍' : a === 3 ? '😊' : '💪';
        detailsHTML += `
            <div class="results-row">
                <span class="q-label">${icon} שאלה ${i + 1}: ${q.question.substring(0, 40)}${q.question.length > 40 ? '...' : ''}</span>
                <span class="q-attempts">${a === 1 ? 'ניסיון 1! 🌟' : a + ' ניסיונות'}</span>
            </div>`;
    });

    const totalAttempts = attempts.reduce((s, a) => s + a, 0);

    resultsScreen.innerHTML = `
        <div class="results-title">🏛️ סיימת את החידון! 🏛️</div>
        <div class="results-name">${playerName}, ${rating.label}</div>
        <div class="results-stars">${rating.stars}</div>
        <div class="results-score">${score} / ${maxScore} נקודות</div>
        <div class="gold-line"></div>
        <div class="results-message">
            סה"כ ${totalAttempts} ניסיונות ב-${questions.length} שאלות<br>
            ${totalAttempts === questions.length ? 'וואו! ענית נכון על הכל בניסיון ראשון! אתה אלוף! 🏆' :
              totalAttempts <= questions.length + 3 ? 'תוצאה מעולה! יש לך זיכרון של פיל! 🐘' :
              'כל הכבוד! היה כיף לשחק! 🎉'}
        </div>
        <div class="results-details">${detailsHTML}</div>
        <button class="restart-btn" onclick="restartQuiz()">🔄 שחקו שוב!</button>
    `;

    // Big confetti celebration
    createConfetti(60);
}

function restartQuiz() {
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('welcome-screen').style.display = 'block';
    document.getElementById('playerName').value = '';
    currentQuestion = 0;
    attempts = [];
}

function createConfetti(count) {
    const container = document.getElementById('confettiContainer');
    const colors = ['#ffd700', '#d4af37', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ff9ff3', '#54a0ff'];
    for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2 + Math.random() * 3) + 's';
        piece.style.animationDelay = Math.random() * 1.5 + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.width = (6 + Math.random() * 10) + 'px';
        piece.style.height = (6 + Math.random() * 10) + 'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 5500);
    }
}

// Enter key starts quiz
document.getElementById('playerName').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') startQuiz();
});
</script>
